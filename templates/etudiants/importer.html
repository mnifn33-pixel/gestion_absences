{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-header bg-info text-white">
                <h4><i class="fas fa-file-excel me-2"></i>Importer des Étudiants</h4>
            </div>
            <div class="card-body p-4">
                <div class="alert alert-info">
                    <i class="fas fa-info-circle me-2"></i>
                    Le fichier Excel doit contenir les colonnes dans cet ordre :
                    <strong>Nom, Prénom, Classe, Numéro étudiant</strong>
                </div>
                <form method="POST" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label class="form-label">Fichier Excel (.xlsx)</label>
                        <input type="file" name="fichier" class="form-control" accept=".xlsx" required>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-info w-100">
                            <i class="fas fa-upload me-2"></i>Importer
                        </button>
                        <a href="{{ url_for('etudiants.liste') }}" class="btn btn-secondary w-100">
                            <i class="fas fa-arrow-left me-2"></i>Retour
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
