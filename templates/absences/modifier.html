{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card shadow">
            <div class="card-header bg-warning text-white">
                <h4><i class="fas fa-edit me-2"></i>Modifier une Absence</h4>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    {% if current_user.role == 'enseignant' %}
                    <div class="mb-3">
                        <label class="form-label">Numéro étudiant</label>
                        <input type="text" name="num_etudiant" class="form-control" value="{{ absence.etudiant.num_etudiant }}" required>
                    </div>
                    {% else %}
                    <div class="mb-3">
                        <label class="form-label">Étudiant</label>
                        <select name="etudiant_id" class="form-select" required>
                            {% for etudiant in etudiants %}
                                <option value="{{ etudiant.id }}" {% if etudiant.id == absence.etudiant_id %}selected{% endif %}>
                                    {{ etudiant.nom }} {{ etudiant.prenom }} — {{ etudiant.classe }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>
                    {% endif %}

                    <div class="mb-3">
                        <label class="form-label">Date d'absence</label>
                        <input type="date" name="date_absence" class="form-control" value="{{ absence.date_absence }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Matière</label>
                        <input type="text" name="matiere" class="form-control" value="{{ absence.matiere }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Nombre d'heures</label>
                        <input type="number" name="nb_heures" class="form-control" step="0.5" value="{{ absence.nb_heures }}" required>
                    </div>
                    <div class="mb-3 form-check">
                        <input type="checkbox" name="justifiee" class="form-check-input" id="justifiee" {% if absence.justifiee %}checked{% endif %}>
                        <label class="form-check-label" for="justifiee">Absence justifiée</label>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Motif</label>
                        <textarea name="motif" class="form-control" rows="3">{{ absence.motif }}</textarea>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-warning w-100">
                            <i class="fas fa-save me-2"></i>Enregistrer
                        </button>
                        <a href="{{ url_for('etudiants.liste') }}" class="btn btn-secondary w-100">
                            <i class="fas fa-arrow-left me-2"></i>Retour
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
